name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fundamentals-fixtures:
    # Stable required check for branch protection. The full matrix also runs this
    # test, but this job gives fundamentals changes one explicit, grepable gate.
    name: Fundamentals fixtures (20 issuers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project with dev extras
        run: uv sync --extra dev

      - name: Verify independently reviewed Company Facts fixtures
        env:
          FUNDAMENTALS_COVERAGE_DIR: /tmp/fundamentals-coverage
        run: uv run python -m pytest tests/test_recorded_companyfacts.py -q

      - name: Publish actual assertion coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundamentals-assertion-coverage
          path: /tmp/fundamentals-coverage/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project with dev extras
        run: uv sync --extra dev

      # The suite is hermetic by design: no test may reach SEC. A network-dependent test
      # would both flake in CI and risk hammering SEC's fair-access budget from shared
      # runners.
      - name: Run tests
        run: uv run python -m pytest tests/ -q

      - name: Reject whitespace errors
        run: git diff --check

  minimal-install:
    # Guards the dependency boundary: the core install must stay small enough to parse SEC
    # filings without pulling a web framework, an AWS SDK or an OLAP engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install core package only
        run: |
          uv venv
          uv pip install .

      - name: Core library imports and parses without optional dependencies
        run: |
          uv run --no-project python - <<'PY'
          import sys
          from copetech_sec import SECDataFetcher
          from copetech_sec.form4_processor import Form4Processor

          xml = """<ownershipDocument>
            <documentType>4</documentType>
            <issuer><issuerCik>0000320193</issuerCik><issuerTradingSymbol>AAPL</issuerTradingSymbol></issuer>
            <reportingOwner><reportingOwnerId>
              <rptOwnerCik>0000001111</rptOwnerCik><rptOwnerName>OWNER</rptOwnerName>
            </reportingOwnerId></reportingOwner>
            <aff10b5One>0</aff10b5One>
            <nonDerivativeTable><nonDerivativeTransaction>
              <securityTitle><value>Common Stock</value></securityTitle>
              <transactionDate><value>2026-01-15</value></transactionDate>
              <transactionCoding><transactionCode>P</transactionCode></transactionCoding>
              <transactionAmounts>
                <transactionShares><value>1,000</value></transactionShares>
                <transactionPricePerShare><value>150.00</value></transactionPricePerShare>
                <transactionAcquiredDisposedCode><value>A</value></transactionAcquiredDisposedCode>
              </transactionAmounts>
            </nonDerivativeTransaction></nonDerivativeTable>
          </ownershipDocument>"""

          row = Form4Processor(document_handler=None, fetch_filings_func=None).parse_form4_xml(xml)[0]
          assert row["shares"] == 1000.0, row["shares"]
          assert row["value"] == 150000.0, row["value"]
          assert row["is_acquisition"] is True

          for heavy in ("pandas", "boto3", "fastapi", "duckdb", "yfinance"):
              assert heavy not in sys.modules, f"core install pulled in {heavy}"
          print("core install OK")
          PY

      - name: Optional service command fails helpfully
        run: |
          set +e
          output="$(uv run --no-project copetech-sec-api 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -F "copetech-edgar[service]"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
